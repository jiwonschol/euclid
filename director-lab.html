</style></head><body><h1>같은 상황, 다른 감독 지시</h1><p>양쪽은 같은 선수 위치·상대 준비·난수로 시작합니다. 두 결과를 함께 보고 달라진 이동과 남겨진 공간을 비교하세요.</p><nav><label>비교 장면 <select id="case"></select></label><button id="play">두 선택 재생</button><button id="next">다음 국면까지 보기</button><label><input id="reduced" type="checkbox">동작 줄이기</label><a href="director.html">한 경기 하기</a></nav><p id="question"></p><div class="pairs"><article id="first"><h2></h2><canvas class="stage" aria-label="첫 선택 경기 장면"></canvas><p class="caption" role="status"></p><canvas class="radar" aria-label="첫 선택 전술 필드"></canvas><p class="cost"></p><div class="facts"></div></article><article id="second"><h2></h2><canvas class="stage" aria-label="두 번째 선택 경기 장면"></canvas><p class="caption" role="status"></p><canvas class="radar" aria-label="두 번째 선택 전술 필드"></canvas><p class="cost"></p><div class="facts"></div></article></div><p class="notes">한 번의 성공이 전술의 우월함을 증명하지는 않습니다. 상대의 준비, 선택 이유, 실제 행동 변화, 대가를 다섯 장면 중 네 장면에서 설명할 수 있는지 확인해 주세요. 그 뒤 한 경기를 다시 판단해 보고 싶은지도 확인합니다.</p><div class="outcomes">판정별 장면 확인: <span id="outcome-links"></span></div><script type="module" src="js/director/lab.js"></script></body></html>
