<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>euclid — 연속 경기 뷰어 (중계 중심)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0f1216; color: #e8ecf1; font: 14px/1.55 system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }
  .top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 12px; }
  .score { font-size: 24px; font-weight: 800; letter-spacing: 0.3px; }
  .score .a { color: #6f9bff; } .score .b { color: #ff8080; }
  .clock { font-variant-numeric: tabular-nums; font-size: 16px; color: #cfd8e3; }
  .chip { font-size: 12px; color: #90a0b4; padding: 3px 9px; border: 1px solid #2b3340; border-radius: 999px; }
  .controls { display: flex; gap: 7px; margin-left: auto; flex-wrap: wrap; }
  button { background: #1c2530; color: #e8ecf1; border: 1px solid #2f3b49; border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  button:hover { background: #26313e; } button.on { background: #2f6bff; border-color: #2f6bff; color: #fff; }

  .statrow { display: grid; grid-template-columns: 1.3fr 1.3fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat { background: #151a21; border: 1px solid #212a34; border-radius: 10px; padding: 9px 12px; }
  .stat .lbl { font-size: 11px; color: #8090a2; letter-spacing: 0.4px; margin-bottom: 6px; text-transform: uppercase; }
  .bar { height: 9px; border-radius: 6px; overflow: hidden; display: flex; background: #0e1319; }
  .bar .fa { background: #3a63c4; } .bar .fb { background: #c44a4a; }
  .pct { display: flex; justify-content: space-between; font-size: 12px; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .pct .a { color: #8fb0ff; } .pct .b { color: #ff9d9d; }
  .mom { position: relative; height: 9px; border-radius: 6px; background: #0e1319; overflow: hidden; }
  .mom .fill { position: absolute; top: 0; bottom: 0; }
  .mom .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: #4a5666; }
  .shots { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .shots .a { color: #8fb0ff; } .shots .b { color: #ff9d9d; } .shots small { font-size: 12px; color: #7d8a9c; font-weight: 500; }

  .main { display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; align-items: start; }
  .feedwrap { background: #12161c; border: 1px solid #212a34; border-radius: 12px; padding: 4px; }
  .feedhead { font-size: 11px; color: #8090a2; letter-spacing: 0.5px; padding: 7px 10px 4px; text-transform: uppercase; }
  .feed { height: 540px; overflow-y: auto; padding: 4px 10px 10px; scroll-behavior: smooth; }
  .line { padding: 4px 2px; border-bottom: 1px solid rgba(255,255,255,0.035); }
  .line .ts { color: #5f6b7a; font-variant-numeric: tabular-nums; font-size: 12px; margin-right: 7px; }
  .line.flow { color: #d3dae3; }
  .line.play { color: #aab6c4; }
  .line.save { color: #4fd1c5; }
  .line.goal { color: #ffd54a; font-weight: 800; font-size: 15px; }
  .line.stat { color: #8ea2b8; background: rgba(120,150,190,0.06); border-radius: 6px; padding: 5px 8px; }
  .line.sys { color: #c8d2de; font-weight: 700; text-align: center; border-bottom: none; margin: 6px 0; }
  canvas { width: 100%; height: auto; display: block; border-radius: 10px; background: #256; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
  .legend { font-size: 12px; color: #7d8a9c; margin-top: 8px; line-height: 1.7; }

  .deck { margin-top: 14px; background: #12161c; border: 1px solid #212a34; border-radius: 12px; padding: 12px 14px; }
  .deckhead { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .cp { font-weight: 700; font-size: 14px; } .cp b { color: #ffd54a; font-size: 19px; margin-left: 2px; }
  .dchip { font-size: 12px; padding: 3px 11px; border-radius: 999px; border: 1px solid #2f3b49; color: #aab6c4; }
  .dchip.active { color: #8fb0ff; border-color: #38507f; }
  .dchip.pending { color: #ffcf6b; border-color: #7a6a2a; background: rgba(255,207,107,0.07); }
  .hint { color: #6f7c8c; font-size: 12px; margin-left: auto; }
  .hand { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 8px; }
  .card { text-align: left; background: #1a2230; border: 1px solid #2b3646; border-radius: 10px; padding: 9px 11px; cursor: pointer; color: #e8ecf1; transition: border-color .1s, background .1s; }
  .card:hover:not(:disabled) { border-color: #3a63c4; background: #1f2938; }
  .card:disabled { opacity: 0.38; cursor: not-allowed; }
  .card .cn { font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
  .card .cn .cc { color: #ffd54a; font-variant-numeric: tabular-nums; font-size: 12px; }
  .card .cd { font-size: 11px; color: #8090a2; margin-top: 4px; line-height: 1.4; }
  @media (max-width: 820px) { .main { grid-template-columns: 1fr; } .statrow { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="score"><span class="a">수원 <b id="sa">0</b></span> : <span class="b"><b id="sb">0</b> 인천</span></div>
    <div class="clock" id="clock">00:00 · 전반</div>
    <div class="chip" id="phase">—</div>
    <div class="controls">
      <button id="play" class="on">❚❚ 일시정지</button>
      <button id="restart">↻ 새 경기</button>
      <button class="spd on" data-s="1">1×</button>
      <button class="spd" data-s="2">2×</button>
      <button class="spd" data-s="4">4×</button>
    </div>
  </div>

  <div class="statrow">
    <div class="stat">
      <div class="lbl">점유율</div>
      <div class="bar"><div class="fa" id="posA" style="width:50%"></div><div class="fb" id="posB" style="width:50%"></div></div>
      <div class="pct"><span class="a" id="posAt">50%</span><span class="b" id="posBt">50%</span></div>
    </div>
    <div class="stat">
      <div class="lbl">경기 흐름 (모멘텀)</div>
      <div class="mom"><div class="fill" id="mom"></div><div class="mid"></div></div>
      <div class="pct"><span class="a">수원</span><span class="b">인천</span></div>
    </div>
    <div class="stat">
      <div class="lbl">유효슈팅</div>
      <div class="shots"><span class="a" id="stA">0</span> <small>·</small> <span class="b" id="stB">0</span></div>
    </div>
  </div>

  <div class="main">
    <div class="feedwrap">
      <div class="feedhead">📻 실시간 중계</div>
      <div class="feed" id="feed"></div>
    </div>
    <div>
      <canvas id="pitch" width="820" height="560"></canvas>
      <div class="legend">파랑 수원 · 빨강 인천 · 노랑/초록 GK. 흰 테두리=볼 소유, 노란 링=압박.<br>
        경기는 <b>글(중계)</b>로 읽고, 바둑판은 그 실현입니다.</div>
    </div>
  </div>

  <div class="deck">
    <div class="deckhead">
      <span class="cp">CP <b id="cp">3</b></span>
      <span class="dchip active" id="active">전술: 균형</span>
      <span class="dchip pending" id="pending" style="display:none"></span>
      <span class="hint">카드 = '전달 중' → 도착. 전달 중 다른 카드 = 오디블(교체·비용 1회).</span>
    </div>
    <div class="hand" id="hand"></div>
  </div>
</div>

<script type="module">
  import { createMatch, tick, SIM_DT } from './js/game/match.js';
  import { makeView, draw } from './js/ui/pitch2d.js';
  import { playDirective } from './js/game/directives.js';
  const $ = (id) => document.getElementById(id);
  const view = makeView($('pitch'));
  let cfg = null, com = null, cards = null, state = null, playing = true, speed = 1, acc = 0, last = performance.now(), seed = 1, feedId = 0;

  const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

  function hud() {
    $('sa').textContent = state.score.A; $('sb').textContent = state.score.B;
    $('clock').textContent = `${fmt(state.clockSeconds)} · ${state.half === 1 ? '전반' : '후반'}`;
    $('phase').textContent = state.phase === 'IN_PLAY' ? '경기 중' : state.phase;
  }
  function stats() {
    const s = state.stats; if (!s) return;
    const tot = s.possTicks.A + s.possTicks.B || 1;
    const pa = Math.round(100 * s.possTicks.A / tot);
    $('posA').style.width = pa + '%'; $('posB').style.width = (100 - pa) + '%';
    $('posAt').textContent = pa + '%'; $('posBt').textContent = (100 - pa) + '%';
    const m = Math.max(-60, Math.min(60, s.momentum)); const pct = Math.abs(m) / 60 * 50;
    const fill = $('mom');
    if (m >= 0) { fill.style.left = (50 - pct) + '%'; fill.style.width = pct + '%'; fill.style.background = '#3a63c4'; }
    else { fill.style.left = '50%'; fill.style.width = pct + '%'; fill.style.background = '#c44a4a'; }
    $('stA').textContent = s.onTarget.A; $('stB').textContent = s.onTarget.B;
  }
  function feed() {
    if (!state.feed) return;
    const box = $('feed');
    for (const f of state.feed) {
      if (f.id <= feedId) continue; feedId = f.id;
      const div = document.createElement('div');
      div.className = 'line ' + f.kind;
      if (f.kind !== 'sys') { const ts = document.createElement('span'); ts.className = 'ts'; ts.textContent = fmt(f.t); div.appendChild(ts); }
      div.appendChild(document.createTextNode(f.text));
      box.appendChild(div);
    }
    while (box.children.length > 180) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
  }

  const TAC = { balanced: '균형', attack: '공격', counter: '역습', park: '잠그기' };
  const LH = { low: '라인↓', mid: '', high: '라인↑' };
  const tacLabel = (t) => ['전술: ' + (TAC[t.tactic] || t.tactic), LH[t.lineHeight], t.press === 'high' ? '압박↑' : ''].filter(Boolean).join(' · ');
  const cardCost = (id) => { const c = cards.cards.find((x) => x.id === id); return c ? c.cost : 0; };
  function buildHand() {
    const h = $('hand'); h.innerHTML = '';
    for (const c of cards.cards) {
      const b = document.createElement('button'); b.className = 'card'; b.dataset.id = c.id;
      b.innerHTML = `<div class="cn"><span>${c.name}</span><span class="cc">${c.cost} CP</span></div><div class="cd">${c.desc}</div>`;
      b.onclick = () => { if (!state) return; const r = playDirective(state, c.id, cards); if (!r.ok) b.animate([{ borderColor: '#c4504a' }, { borderColor: '#2b3646' }], { duration: 450 }); };
      h.appendChild(b);
    }
  }
  function deck() {
    if (!state || !state.cp) return;
    const cp = Math.floor(state.cp.A);
    $('cp').textContent = cp;
    $('active').textContent = tacLabel(state.tactics.A);
    const p = state.pending.A, pe = $('pending');
    if (p) { pe.style.display = ''; pe.textContent = `전달 중: ${p.name} (${Math.max(0, p.applyAt - state.clockSeconds).toFixed(1)}s)`; }
    else pe.style.display = 'none';
    const refund = p ? cardCost(p.cardId) : 0;
    for (const b of $('hand').children) { b.disabled = cardCost(b.dataset.id) > cp + refund; b.classList.toggle('audible', !!p); }
  }

  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (playing && state) { acc += dt * speed; let n = 0; while (acc >= SIM_DT && n < 2000) { tick(state); acc -= SIM_DT; n++; } }
    if (state) { draw(view, state); hud(); stats(); feed(); deck(); }
    requestAnimationFrame(frame);
  }
  function newGame() { state = createMatch(seed, cfg, com, cards); acc = 0; feedId = 0; $('feed').innerHTML = ''; }

  $('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '❚❚ 일시정지' : '▶ 재생'; $('play').classList.toggle('on', playing); };
  $('restart').onclick = () => { seed++; newGame(); };
  for (const b of document.querySelectorAll('.spd')) b.onclick = () => { speed = +b.dataset.s; for (const x of document.querySelectorAll('.spd')) x.classList.toggle('on', x === b); };

  Promise.all([fetch('./data/engine.json').then(r => r.json()), fetch('./data/commentary.json').then(r => r.json()), fetch('./data/cards.json').then(r => r.json())])
    .then(([e, c, cd]) => { cfg = e; com = c; cards = cd; buildHand(); newGame(); requestAnimationFrame(frame); })
    .catch((err) => { document.body.insertAdjacentHTML('beforeend', `<p style="color:#f88">로드 실패: ${err}. tools/serve.py 로 실행하세요.</p>`); });
</script>
</body>
</html>
