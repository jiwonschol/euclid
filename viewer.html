<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>euclid — 연속 경기 뷰어 (중계 중심)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0f1216; color: #e8ecf1; font: 14px/1.55 system-ui, -apple-system, sans-serif; }
  /* 1280×720 에서도 손패가 화면 안에 있어야 한다(§2 "화면 하단 손패" · §17 UI 완료조건).
     문서 흐름이던 때는 페이지가 936px 이 되어 손패 top=797 > 720 → 스크롤해야 자기 패가 보였다.
     뷰포트 높이 flex 열로 바꿔 손패를 바닥에 고정하고, 남는 높이를 중계/필드가 나눠 갖는다. */
  .wrap { max-width: 1180px; margin: 0 auto; padding: 12px 16px; height: 100vh; box-sizing: border-box;
          display: flex; flex-direction: column; gap: 10px; }
  .wrap > .deck { flex: 0 0 auto; }                    /* 손패는 항상 바닥 */
  .main { flex: 1 1 auto; min-height: 0; }             /* 남는 높이를 갖되 줄어들 수 있어야 */
  .main > * { min-height: 0; }
  .feedwrap { display: flex; flex-direction: column; min-height: 0; height: 100%; }
  .top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 12px; }
  .score { font-size: 24px; font-weight: 800; letter-spacing: 0.3px; }
  .score .a { color: #6f9bff; } .score .b { color: #ff8080; }
  .clock { font-variant-numeric: tabular-nums; font-size: 16px; color: #cfd8e3; }
  .chip { font-size: 12px; color: #90a0b4; padding: 3px 9px; border: 1px solid #2b3340; border-radius: 999px; }
  .controls { display: flex; gap: 7px; margin-left: auto; flex-wrap: wrap; }
  button { background: #1c2530; color: #e8ecf1; border: 1px solid #2f3b49; border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  button:hover { background: #26313e; } button.on { background: #2f6bff; border-color: #2f6bff; color: #fff; }

  .statrow { display: grid; grid-template-columns: 1.3fr 1.3fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat { background: #151a21; border: 1px solid #212a34; border-radius: 10px; padding: 9px 12px; }
  .stat .lbl { font-size: 11px; color: #8090a2; letter-spacing: 0.4px; margin-bottom: 6px; text-transform: uppercase; }
  .bar { height: 9px; border-radius: 6px; overflow: hidden; display: flex; background: #0e1319; }
  .bar .fa { background: #3a63c4; } .bar .fb { background: #c44a4a; }
  .pct { display: flex; justify-content: space-between; font-size: 12px; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .pct .a { color: #8fb0ff; } .pct .b { color: #ff9d9d; }
  .mom { position: relative; height: 9px; border-radius: 6px; background: #0e1319; overflow: hidden; }
  .mom .fill { position: absolute; top: 0; bottom: 0; }
  .mom .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: #4a5666; }
  .shots { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .shots .a { color: #8fb0ff; } .shots .b { color: #ff9d9d; } .shots small { font-size: 12px; color: #7d8a9c; font-weight: 500; }

  .main { display: grid; grid-template-columns: 1fr 1.3fr; gap: 14px; align-items: stretch; }
  .feedwrap { background: #12161c; border: 1px solid #212a34; border-radius: 12px; padding: 4px; }
  .feedhead { font-size: 11px; color: #8090a2; letter-spacing: 0.5px; padding: 7px 10px 4px; text-transform: uppercase; }
  .feed { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 12px 12px; scroll-behavior: smooth; font-size: 21px; line-height: 1.62; }
  .line { padding: 4px 2px; border-bottom: 1px solid rgba(255,255,255,0.035); }
  .line .ts { color: #5f6b7a; font-variant-numeric: tabular-nums; font-size: 12px; margin-right: 7px; }
  .line.flow { color: #d3dae3; }
  .line.play { color: #aab6c4; }
  .line.save { color: #4fd1c5; }
  .line.goal { color: #ffd54a; font-weight: 800; font-size: 15px; }
  .line.stat { color: #8ea2b8; background: rgba(120,150,190,0.06); border-radius: 6px; padding: 5px 8px; }
  .line.sys { color: #c8d2de; font-weight: 700; text-align: center; border-bottom: none; margin: 6px 0; }
  /* 경기장은 실제 축구장 비율(105:68)을 지키고 화면 높이로만 상한을 둔다.
     이전 구현은 부모가 높이를 못 받아 483×31 픽셀(화면의 1.6%) 띠로 눌렸다 — 22명이 31px 안에 들어갔다. */
  canvas { width: 100%; height: 100%; display: block; border-radius: 10px; background: #256; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
  .main > div:last-child { display: flex; flex-direction: column; min-height: 0; }
  .legend { font-size: 12px; color: #7d8a9c; margin-top: 8px; line-height: 1.7; }

  .deck { margin-top: 0; background: #12161c; border: 1px solid #212a34; border-radius: 12px; padding: 9px 12px; }
  .deckhead { display: flex; align-items: center; gap: 12px; margin-bottom: 7px; flex-wrap: wrap; }
  .cp { font-weight: 700; font-size: 14px; } .cp b { color: #ffd54a; font-size: 19px; margin-left: 2px; }
  .dchip { font-size: 12px; padding: 3px 11px; border-radius: 999px; border: 1px solid #2f3b49; color: #aab6c4; }
  .dchip.active { color: #8fb0ff; border-color: #38507f; }
  .dchip.pending { color: #ffcf6b; border-color: #7a6a2a; background: rgba(255,207,107,0.07); }
  .hint { color: #6f7c8c; font-size: 12px; margin-left: auto; }
  .hand { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 8px; }
  .card { text-align: left; background: #1a2230; border: 1px solid #2b3646; border-radius: 10px; padding: 9px 11px; cursor: pointer; color: #e8ecf1; transition: border-color .1s, background .1s; }
  .card:hover:not(:disabled) { border-color: #3a63c4; background: #1f2938; }
  .card:disabled { opacity: 0.38; cursor: not-allowed; }
  .card .cn { font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
  .card .cn .cc { color: #ffd54a; font-variant-numeric: tabular-nums; font-size: 12px; }
  .card .cd { font-size: 11px; color: #8090a2; margin-top: 4px; line-height: 1.4; }
  .card .cmeta { font-size: 10px; color: #66748a; margin-top: 5px; letter-spacing: 0.3px; }
  .card.audible:not(:disabled) { border-color: #7a6a2a; }
  .card.ctx { border-color: #b8892a; background: #241f14; }
  .card.ctx:hover:not(:disabled) { border-color: #ffd54a; background: #2b2416; }
  .effects { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .subrow { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .subbtn { font-size: 12px; padding: 6px 12px; background: #182028; border: 1px dashed #38465a; color: #b9c4d2; border-radius: 8px; }
  .subbtn:hover:not(:disabled) { background: #202b36; } .subbtn:disabled { opacity: 0.35; cursor: not-allowed; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(12px); background: #2a1f22; color: #ffb4ac; border: 1px solid #5a3238; padding: 9px 16px; border-radius: 9px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 20; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 820px) { .main { grid-template-columns: 1fr; } .statrow { grid-template-columns: 1fr 1fr; } }
  /* 감독 스탠스 카드 — 그룹당 3열(밸런스 + 상반 2). 기본은 항상 밸런스가 켜져 있다. */
  .srow { display: grid; grid-template-columns: 84px repeat(3, 1fr); gap: 6px; align-items: stretch; margin-bottom: 5px; }
  .sgl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8fa0b4; font-weight: 600; }
  .scard { text-align: left; padding: 5px 9px; background: #171d25; border: 1px solid #2a3542; color: #cfd8e3;
           border-radius: 9px; cursor: pointer; transition: all .12s; }
  .scard:hover { background: #1e2833; border-color: #3d5570; }
  .scard.on { background: #1d3357; border-color: #4d7fd6; color: #eaf2ff; box-shadow: 0 0 0 1px #4d7fd6 inset; }
  .scard.pend { border-color: #ffb347; border-style: dashed; background: #2a2214; }
  .scard .sn { font-size: 12.5px; font-weight: 700; }
  .scard .sd { font-size: 10px; color: #7e8ea1; margin-top: 1px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scard.on .sd { color: #9dbbe8; }
  /* 참모 — 직접적인 정보 + 한 번에 받아들이기 */
  .adv { display: flex; align-items: center; gap: 12px; background: #1b2430; border: 1px solid #34506e;
         border-left: 3px solid #58a6ff; border-radius: 10px; padding: 7px 12px; margin-bottom: 7px; min-height: 38px; }
  .advt { flex: 1; font-size: 16px; color: #cfe3ff; font-weight: 600; }
  .advb { font-size: 13px; font-weight: 700; padding: 8px 14px; background: #2563c9; border: 0; color: #fff; border-radius: 8px; cursor: pointer; }
  .advb:hover { background: #2f74e0; } .advb:disabled { opacity: .3; cursor: default; }
  .advq { color: #6b7a8c; font-size: 14px; }
  .bu { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(10,14,18,0.82); border-radius: 10px; color: #7f8fa3; font-size: 15px; letter-spacing: 1px; pointer-events: none; }
  .pitchwrap { position: relative; aspect-ratio: 105 / 68; max-height: 58vh;
               width: min(100%, calc(58vh * 105 / 68)); margin: 0 auto; flex: 0 0 auto; display: flex; }
  /* 지시 성공 — 이 게임의 재미는 '감독의 선택'이 통했다는 확인이다 */
  .succ { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 6px; pointer-events: none; opacity: 0; transition: opacity .2s; }
  .succ.show { opacity: 1; }
  .succ b { font-size: 30px; font-weight: 900; color: #ffd54a; text-shadow: 0 3px 14px rgba(0,0,0,.9); letter-spacing: 2px; }
  .succ span { font-size: 14px; color: #fff; background: rgba(10,14,18,.82); padding: 5px 12px; border-radius: 8px; }
  /* 하프타임 — 참모 질의 + 선수 제안 */
  .htback { position: fixed; inset: 0; background: rgba(4,6,9,.78); z-index: 40; display: none; }
  .htback.show { display: block; }
  .ht { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(680px, 92vw);
        max-height: 82vh; background: #12161c; border: 1px solid #34506e; border-radius: 14px; padding: 20px 24px;
        overflow-y: auto; display: none; flex-direction: column; gap: 11px; z-index: 41;
        box-shadow: 0 20px 60px rgba(0,0,0,.7); }
  .ht.show { display: flex; }
  .ht h3 { margin: 0 0 4px; font-size: 22px; color: #ffd54a; }
  .htrow { display: flex; gap: 11px; align-items: center; font-size: 15px; padding: 7px 0; border-top: 1px solid #1e2733; }
  .htw { flex: 0 0 66px; color: #7f8fa3; font-weight: 700; font-size: 13px; }
  .htt { flex: 1; color: #dbe6f2; }
  .htb { font-size: 12px; padding: 5px 12px; background: #2563c9; border: 0; color: #fff; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .htgo { margin-top: 10px; align-self: center; font-size: 16px; font-weight: 700; padding: 9px 24px; background: #2f7d3a; border: 0; color: #fff; border-radius: 9px; cursor: pointer; }
  .pitchwrap > canvas { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="score"><span class="a">수원 <b id="sa">0</b></span> : <span class="b"><b id="sb">0</b> 인천</span></div>
    <div class="clock" id="clock">00:00 · 전반</div>
    <div class="chip" id="phase">—</div>
    <div class="controls">
      <button id="play" class="on">❚❚ 일시정지</button>
      <button id="restart">↻ 새 경기</button>
      <button class="spd on" data-s="1">1×</button>
      <button class="spd" data-s="2">2×</button>
      <button class="spd" data-s="4">4×</button>
    </div>
  </div>

  <div class="statrow">
    <div class="stat">
      <div class="lbl">점유율</div>
      <div class="bar"><div class="fa" id="posA" style="width:50%"></div><div class="fb" id="posB" style="width:50%"></div></div>
      <div class="pct"><span class="a" id="posAt">50%</span><span class="b" id="posBt">50%</span></div>
    </div>
    <div class="stat">
      <div class="lbl">경기 흐름 (모멘텀)</div>
      <div class="mom"><div class="fill" id="mom"></div><div class="mid"></div></div>
      <div class="pct"><span class="a">수원</span><span class="b">인천</span></div>
    </div>
    <div class="stat">
      <div class="lbl">유효슈팅</div>
      <div class="shots"><span class="a" id="stA">0</span> <small>·</small> <span class="b" id="stB">0</span></div>
    </div>
    <div class="stat">
      <div class="lbl">xG (기대득점)</div>
      <div class="shots"><span class="a" id="xgA">0.0</span> <small>·</small> <span class="b" id="xgB">0.0</span></div>
    </div>
    <div class="stat">
      <div class="lbl">코너킥</div>
      <div class="shots"><span class="a" id="ckA">0</span> <small>·</small> <span class="b" id="ckB">0</span></div>
    </div>
  </div>

  <div class="main">
    <div class="feedwrap">
      <div class="feedhead">📻 실시간 중계</div>
      <div class="feed" id="feed"></div>
    </div>
    <div>
      <div class="pitchwrap"><canvas id="pitch" width="820" height="560"></canvas><div class="bu" id="bu" style="display:none">빌드업 — 중계로 상황을 읽으세요</div><div class="succ" id="succ"><b>지시 성공</b><span id="succt"></span></div></div>
      <div class="legend">파랑 수원 · 빨강 인천 · 노랑/초록 GK. 흰 테두리=볼 소유, 노란 링=압박.<br>
        경기는 <b>글(중계)</b>로 읽고, 바둑판은 그 실현입니다.</div>
    </div>
  </div>

  <div class="deck">
    <div class="adv" id="adv">
      <span class="advt advq" id="advt">참모가 상황을 지켜보고 있습니다…</span>
      <button class="advb" id="advb" disabled>조언 받아들이기</button>
    </div>
    <div class="deckhead">
      <span class="dchip active" id="active">전술: 균형</span>
      <span class="dchip" id="subs">교체 0/3</span>
      <span class="dchip pending" id="pending" style="display:none"></span>
      <span class="hint">카드를 고르면 '전달 중' → 도착. 기본값은 밸런스입니다.</span>
    </div>
    <div id="stance"></div>
    <div class="subrow" id="subrow"></div>
  </div>
</div>
<div class="htback" id="htback"></div>
<div class="ht" id="ht"></div>

<script type="module">
  import { createMatch, tick, SIM_DT, HALF_SECONDS } from './js/game/match.js';
  import { makeView, draw, pickPlayer } from './js/ui/pitch2d.js';
  import { selectStance, acceptAdvice, playSub, halftimeBrief } from './js/game/stance.js';
  import { resolvedFor } from './js/game/effects.js';
  const $ = (id) => document.getElementById(id);
  const view = makeView($('pitch'));
  let cfg = null, com = null, stc = null, state = null, playing = true, speed = 1, acc = 0, last = performance.now(), seed = 1, feedId = 0;

  // 캡처용 URL 파라미터 (goal-harness 연출대). ?seed=3&pauseAt=600&autoplay=0
  // pauseAt 은 '경기초'. 그 지점까지 최고속으로 감고 멈춘 뒤 window.__capture.ready 를 세운다.
  // 캡처 도구는 ready 와 함께 실린 clock 이 요청값과 맞는지 반드시 확인한다 — 안 그러면
  // 로딩 중 화면이나 직전 상태를 이번 회차 그림으로 보고하게 된다.
  const Q = new URLSearchParams(location.search);
  const Q_SEED = Q.has('seed') ? parseInt(Q.get('seed'), 10) : null;
  const Q_PAUSE = Q.has('pauseAt') ? parseFloat(Q.get('pauseAt')) : null;
  window.__capture = { ready: false, clock: null, requested: Q_PAUSE, seed: Q_SEED };

  const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  // 시뮬 하프는 짧지만(프로토 3.5분) 시계는 45:00 하프로 보여준다 — 축구를 보고 있다는 감각.
  const shown = (t) => t * (HALF_SECONDS / (state?.halfSeconds || HALF_SECONDS));

  function hud() {
    $('sa').textContent = state.score.A; $('sb').textContent = state.score.B;
    $('clock').textContent = `${fmt(shown(state.clockSeconds))} · ${state.half === 1 ? '전반' : '후반'}`;
    $('phase').textContent = state.phase === 'IN_PLAY' ? '경기 중' : state.phase;
  }
  function stats() {
    const s = state.stats; if (!s) return;
    const tot = s.possTicks.A + s.possTicks.B || 1;
    const pa = Math.round(100 * s.possTicks.A / tot);
    $('posA').style.width = pa + '%'; $('posB').style.width = (100 - pa) + '%';
    $('posAt').textContent = pa + '%'; $('posBt').textContent = (100 - pa) + '%';
    const m = Math.max(-60, Math.min(60, s.momentum)); const pct = Math.abs(m) / 60 * 50;
    const fill = $('mom');
    if (m >= 0) { fill.style.left = (50 - pct) + '%'; fill.style.width = pct + '%'; fill.style.background = '#3a63c4'; }
    else { fill.style.left = '50%'; fill.style.width = pct + '%'; fill.style.background = '#c44a4a'; }
    $('stA').textContent = s.onTarget.A; $('stB').textContent = s.onTarget.B;
    $('xgA').textContent = s.xg.A.toFixed(1); $('xgB').textContent = s.xg.B.toFixed(1);
    $('ckA').textContent = s.corners.A; $('ckB').textContent = s.corners.B;
  }
  function feed() {
    if (!state.feed) return;
    const box = $('feed');
    for (const f of state.feed) {
      if (f.id <= feedId) continue; feedId = f.id;
      const div = document.createElement('div');
      div.className = 'line ' + f.kind;
      if (f.kind !== 'sys') { const ts = document.createElement('span'); ts.className = 'ts'; ts.textContent = fmt(shown(f.t)); div.appendChild(ts); }
      div.appendChild(document.createTextNode(f.text));
      box.appendChild(div);
    }
    while (box.children.length > 180) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
  }

  const TAC = { balanced: '균형', attack: '공격', counter: '역습', park: '잠그기' };
  const LH = { low: '라인↓', mid: '', high: '라인↑' };
  const DZ = { balance: '', central: '중앙 수비', wing: '측면 수비' };
  const tacLabel = (t) => ['전술: ' + (TAC[t.tactic] || t.tactic), LH[t.lineHeight],
    t.press === 'high' ? '압박↑' : '', DZ[t.defendZone] || ''].filter(Boolean).join(' · ');
  const SUBS = [{ k: 'fw', n: '공격수' }, { k: 'mf', n: '미드필더' }, { k: 'df', n: '수비수' }];

  function toast(msg) {
    let t = $('toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1600);
  }

  // ── 스탠스 그리드: 그룹당 [밸런스][상반A][상반B] 3열. 현재 선택 강조, 전달 중은 점선. ──
  let stanceBuilt = false;
  function renderStance() {
    if (!state.stance) return;
    const box = $('stance');
    if (!stanceBuilt) {
      stanceBuilt = true; box.innerHTML = '';
      for (const g of stc.groups) {
        const row = document.createElement('div'); row.className = 'srow';
        const lbl = document.createElement('div'); lbl.className = 'sgl';
        lbl.textContent = `${g.icon} ${g.name}`; row.appendChild(lbl);
        for (const o of g.options) {
          const btn = document.createElement('button');
          btn.className = 'scard'; btn.dataset.g = g.id; btn.dataset.o = o.id;
          btn.innerHTML = `<div class="sn">${o.name}</div><div class="sd">${o.desc}</div>`;
          btn.onclick = () => { const r = selectStance(state, 'A', g.id, o.id, stc); if (!r.ok) toast(r.reason); };
          row.appendChild(btn);
        }
        box.appendChild(row);
      }
    }
    const p = state.pending.A;
    for (const btn of box.querySelectorAll('.scard')) {
      const on = state.stance.A[btn.dataset.g] === btn.dataset.o;
      const pend = p && p.group === btn.dataset.g && p.option === btn.dataset.o;
      btn.classList.toggle('on', on && !pend);
      btn.classList.toggle('pend', !!pend);
    }
  }

  // ── 참모: 직접적인 정보 + 한 번에 받아들이기 ──
  function renderAdvice() {
    const t = $('advt'), b = $('advb');
    if (state.advice) {
      t.textContent = '🎙️ ' + state.advice.text; t.classList.remove('advq'); b.disabled = false;
    } else { t.textContent = '참모가 상황을 지켜보고 있습니다…'; t.classList.add('advq'); b.disabled = true; }
  }

  let subsBuilt = false;
  function renderSubs() {
    const r = $('subrow'); if (!r) return;
    if (!subsBuilt) {
      subsBuilt = true;
      for (const sb of SUBS) {
        const btn = document.createElement('button'); btn.className = 'subbtn'; btn.dataset.k = sb.k;
        btn.textContent = `${sb.n} 투입`;
        btn.onclick = () => { const rr = playSub(state, sb.k, stc); if (!rr.ok) toast(rr.reason); else toast(`${sb.n} 투입`); };
        r.appendChild(btn);
      }
    }
    for (const btn of r.children) btn.disabled = state.subs.A.left <= 0;
  }

  function deck() {
    if (!state || !state.stance) return;
    $('active').textContent = tacLabel(resolvedFor(state, 'A'));
    const p = state.pending.A, pe = $('pending');
    if (p) { pe.style.display = ''; pe.textContent = `전달 중: ${p.optionName} (${Math.max(0, p.applyAt - state.clockSeconds).toFixed(1)}s)`; }
    else pe.style.display = 'none';
    $('subs').textContent = `교체 ${stc.subs.limit - state.subs.A.left}/${stc.subs.limit}`;
    renderSubs(); renderStance(); renderAdvice();
  }

  // ── 지시 성공: 마지막 DIRECTIVE_SUCCESS 를 피치 중앙에 띄우고 그 시퀀스를 보여준다 ──
  let succSeen = 0, succUntil = 0;
  function succ() {
    const evs = state.eventLog;
    for (let i = evs.length - 1; i >= 0 && i >= evs.length - 40; i--) {
      const e = evs[i];
      if (e.type !== 'DIRECTIVE_SUCCESS') continue;
      if (e.t > succSeen) { succSeen = e.t; succUntil = performance.now() + 2600; $('succt').textContent = e.text; }
      break;
    }
    $('succ').classList.toggle('show', performance.now() < succUntil);
  }

  // ── 하프타임: 참모 질의 + 선수 제안 → 유저가 고쳐 잡고 '후반 시작' ──
  let htBuilt = false;
  function halftime() {
    const on = state.phase === 'HALFTIME';
    $('ht').classList.toggle('show', on); $('htback').classList.toggle('show', on);
    if (!on) { htBuilt = false; return; }
    if (htBuilt) return;
    htBuilt = true;
    const box = $('ht'); box.innerHTML = '<h3>하프타임</h3>';
    for (const b of halftimeBrief(state, stc)) {
      const row = document.createElement('div'); row.className = 'htrow';
      row.innerHTML = `<div class="htw">${b.who}</div><div class="htt">${b.text}</div>`;
      if (b.suggest) {
        const btn = document.createElement('button'); btn.className = 'htb'; btn.textContent = '받아들이기';
        btn.onclick = () => { selectStance(state, 'A', b.suggest.group, b.suggest.option, stc); btn.textContent = '적용됨'; btn.disabled = true; };
        row.appendChild(btn);
      }
      box.appendChild(row);
    }
    const go = document.createElement('button'); go.className = 'htgo'; go.textContent = '후반 시작 ▶';
    go.onclick = () => { state.resumeRequested = true; $('ht').classList.remove('show'); $('htback').classList.remove('show'); };
    box.appendChild(go);
  }

  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (playing && state) { acc += dt * speed * baseRate(); let n = 0; while (acc >= SIM_DT && n < 6000) { tick(state); acc -= SIM_DT; n++; } }
    if (state) {
      const bu = state.seq && state.seq.mode === 'BUILDUP';
      draw(view, state, {});                       // 22명은 항상 보인다 — 빈 경기장은 축구로 읽히지 않는다
      $('bu').style.display = bu ? '' : 'none';
      hud(); stats(); feed(); deck(); succ(); halftime();
    }
    requestAnimationFrame(frame);
  }
    // 압축 배율(마스터 §3): 시뮬은 5400 경기초를 그대로 돌리고 실시간만 압축한다.
  // 안 하면 1× = 90분 실플레이가 되어 "경기가 안 끝난다"(디자이너 지적 #1).
  const baseRate = () => (2 * (state?.halfSeconds || HALF_SECONDS)) / (stc.pace?.matchRealSec || 210);
  function newGame() {
    state = createMatch(seed, cfg, com, stc);
    state.haltAtHalftime = true;        // 하프타임에 멈춘다(참모 질의·선수 제안)
    acc = 0; feedId = 0; htBuilt = false; $('feed').innerHTML = ''; $('ht').classList.remove('show'); $('htback').classList.remove('show');
  }
  window.__dbg = { state: () => state, tick: (n) => { for (let i = 0; i < (n || 1); i++) tick(state); return state.clockSeconds; } };

  $('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '❚❚ 일시정지' : '▶ 재생'; $('play').classList.toggle('on', playing); };
  $('restart').onclick = () => { seed++; newGame(); };
  for (const b of document.querySelectorAll('.spd')) b.onclick = () => { speed = +b.dataset.s; for (const x of document.querySelectorAll('.spd')) x.classList.toggle('on', x === b); };
  $('advb').onclick = () => { const r = acceptAdvice(state, stc); if (!r.ok) toast(r.reason); };

  Promise.all([fetch('./data/engine.json').then(r => r.json()), fetch('./data/commentary.json').then(r => r.json()), fetch('./data/stance.json').then(r => r.json())])
    .then(([e, c, sc]) => {
      cfg = e; com = c; stc = sc;
      if (Q_SEED !== null) seed = Q_SEED;
      newGame();
      if (Q_PAUSE !== null) {                       // 결정론 캡처: 요청한 경기초까지 감고 멈춘다
        let guardTicks = 0;
        while (state.clockSeconds < Q_PAUSE && state.phase !== 'FULLTIME' && guardTicks++ < 300000) tick(state);
        state.resumeRequested = true;               // 하프타임 정지에 걸려 못 넘어가는 것 방지
        playing = false;
        $('play').textContent = '▶ 재생'; $('play').classList.remove('on');
        window.__capture = { ready: true, clock: state.clockSeconds, requested: Q_PAUSE, seed,
                            reachedEnd: state.phase === 'FULLTIME', ticks: state.tickCount };
      } else if (Q.get('autoplay') === '0') { playing = false; $('play').textContent = '▶ 재생'; $('play').classList.remove('on'); }
      requestAnimationFrame(frame);
    })
    .catch((err) => { document.body.insertAdjacentHTML('beforeend', `<p style="color:#f88">로드 실패: ${err}. tools/serve.py 로 실행하세요.</p>`); });
</script>
</body>
</html>
