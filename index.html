<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>그라운드의 유클리드 — 프로토타입 v0.1</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 로딩 실패 안내 (file:// 직접 열기 등) -->
  <div id="screen-error" class="screen hidden">
    <h1>데이터를 불러오지 못했습니다</h1>
    <p>브라우저 보안 정책 때문에 파일을 직접 열면 JSON을 읽을 수 없습니다.</p>
    <p><b>start.command</b>를 더블클릭하거나, 터미널에서 <code>npm start</code> 실행 후<br/>
      <code>http://localhost:8642</code>로 접속해 주세요.</p>
  </div>

  <!-- 참모 선택 (경기 시작 전) -->
  <div id="screen-select" class="screen hidden">
    <h1>그라운드의 유클리드</h1>
    <p class="subtitle">프로토타입 v0.1 — 벤치에 앉을 참모를 선택하세요</p>
    <div id="advisor-choices"></div>
  </div>

  <!-- 경기 화면 (§5 단일 화면). 피치는 70% 축소·중앙, 참모/중계 메시지는 분리해 피치 아래 중앙 (2026-07-14 디자이너 지시) -->
  <div id="screen-match" class="hidden">
    <div class="match-left">
      <div id="scoreboard">
        <span class="team home">수원</span>
        <span id="score">0 : 0</span>
        <span class="team away">인천</span>
        <span id="clock">0'</span>
        <span id="speed-controls"></span>
      </div>
      <div id="pitch-wrap">
        <canvas id="pitch"></canvas>
        <div id="banner" class="hidden"></div>
        <div id="scene-transition" class="hidden"><div class="st-minute"></div></div>
      </div>
      <div id="message-row">
        <div id="advisor-panel">
          <div class="msg-label">참모</div>
          <div id="advisor-head">
            <span id="advisor-face">😐</span>
            <span id="advisor-name"></span>
          </div>
          <div id="advisor-hint"></div>
        </div>
        <div id="strip">
          <div class="msg-label">중계</div>
          <div id="strip-l1"></div>
          <div id="strip-l2"></div>
        </div>
      </div>
    </div>
    <div class="match-right">
      <div id="tokens-row">
        <span id="tokens"></span>
        <span id="subs"></span>
      </div>
      <div id="cards"></div>
      <button id="debug-toggle">디버그</button>
    </div>
  </div>

  <!-- 경기 후 브리핑 (§11) -->
  <div id="screen-briefing" class="screen hidden">
    <h1 id="briefing-score"></h1>
    <p id="briefing-summary"></p>
    <div id="briefing-items"></div>
    <button id="btn-again">한 경기 더</button>
  </div>

  <!-- 풀 컷인 오버레이 -->
  <div id="cutin" class="hidden">
    <div class="cutin-title"></div>
    <div class="cutin-sub"></div>
  </div>

  <!-- 디버그 패널 (§9 PRD 상시 표시) -->
  <div id="debug" class="hidden"><pre id="debug-pre"></pre></div>

  <script type="module">
    // 캐시 마이그레이션 안전망 (2026-07-14): no-store 서버(tools/serve.py) 도입 이전에
    // 브라우저가 캐시해 둔 옛 모듈이 새 모듈과 섞여 로드되면 조용히 고장 난다(실제 발생).
    // 최초 1회 전 파일을 네트워크에서 강제 재적재한 뒤 새로고침한다. 이후엔 no-store라 재발 없음.
    const REGIME = "euclid-cache-no-store-v1";
    if (localStorage.getItem(REGIME)) {
      import("./js/main.js");
    } else {
      const files = ["./", "css/style.css", "js/main.js", "js/ui/renderer.js", "js/ui/cutin.js",
        "js/engine/match.js", "js/engine/motion.js", "js/engine/rng.js", "js/engine/conditions.js",
        "js/engine/sceneSelector.js", "js/engine/outcome.js", "js/engine/opponentAI.js",
        "js/engine/briefing.js", "js/engine/prd.js",
        "data/config.json", "data/formations.json", "data/scenes.json", "data/cards.json",
        "data/caster.json", "data/advisors.json"];
      Promise.allSettled(files.map((f) => fetch(f, { cache: "reload" }))).then(() => {
        localStorage.setItem(REGIME, "1");
        location.reload();
      });
    }
  </script>
</body>
</html>
